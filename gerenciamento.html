<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Frota - Admin</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --bg-body: #f1f5f9;
            --card-bg: #ffffff;
            --primary: #2563eb;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg-body); margin: 0; padding: 0; color: #1e293b; }
        .header { 
            background: #0f172a; 
            color: white; 
            padding: 1rem 2rem; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }
        .header h1 { font-size: 1.25rem; margin: 0; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .container { padding: 2rem; max-width: 1200px; margin: auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
        
        .card-motorista { 
            background: var(--card-bg); 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); 
            border: 1px solid #e2e8f0;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }
        .card-motorista:hover { transform: translateY(-4px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        
        .foto-thumb { width: 56px; height: 56px; object-fit: cover; border-radius: 50%; border: 3px solid #e2e8f0; cursor: pointer; background: #f1f5f9; }
        
        .status-tag { 
            padding: 4px 10px; 
            border-radius: 20px; 
            font-size: 11px; 
            font-weight: 700; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
            margin-top: 5px;
        }
        
        .info { margin-top: 15px; border-top: 1px solid #f1f5f9; padding-top: 15px; }
        .info p { margin: 8px 0; font-size: 13px; color: #475569; display: flex; align-items: center; gap: 8px; }
        .map-link { 
            color: var(--primary); 
            text-decoration: none; 
            font-weight: 600; 
            display: inline-flex; 
            align-items: center; 
            gap: 4px;
        }
        .map-link:hover { text-decoration: underline; }
        
        .veiculo-img { 
            width: 100%; 
            height: 120px; 
            object-fit: cover; 
            border-radius: 8px; 
            margin-top: 10px;
            background: #f8fafc;
            cursor: pointer;
            transition: opacity 0.2s;
            border: 1px solid #e2e8f0;
        }
        .veiculo-img:hover { opacity: 0.8; }

        .btn-sair {
            background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 500; transition: all 0.2s;
        }
        .btn-sair:hover { background: var(--danger); border-color: var(--danger); }

        .btn-delete {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #fee2e2;
            border: none;
            color: var(--danger);
            cursor: pointer;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .btn-delete:hover { background: var(--danger); color: white; }

        .fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 60px;
            height: 60px;
            background-color: var(--primary);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.4);
            cursor: pointer;
            border: none;
            transition: transform 0.2s, background-color 0.2s;
            z-index: 1000;
        }
        .fab:hover { transform: scale(1.1); background-color: #1d4ed8; }

        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(15, 23, 42, 0.8);
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 16px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        .modal-content h3 { margin-top: 0; display: flex; align-items: center; gap: 10px; color: #0f172a; }
        .modal-content input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .modal-buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
        .btn-cancel { background: #f1f5f9; color: #475569; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .btn-save { background: var(--success); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .btn-edit { background: #dbeafe; color: #1d4ed8; border: none; padding: 8px 12px; border-radius: 7px; cursor: pointer; font-weight: 600; margin-top: 12px; }
        .chat-box { margin-top: 16px; border-top: 1px solid #e2e8f0; padding-top: 14px; }
        .chat-title { font-weight: 700; margin-bottom: 8px; color: #0f172a; }
        .chat-messages { height: 150px; overflow-y: auto; display: flex; flex-direction: column; gap: 7px; padding: 8px; background: #f8fafc; border-radius: 8px; }
        .chat-message { max-width: 85%; padding: 7px 9px; border-radius: 9px; display: grid; gap: 2px; font-size: 12px; }
        .chat-message.mine { align-self: flex-end; background: #dbeafe; }
        .chat-message.theirs { align-self: flex-start; background: #e2e8f0; }
        .chat-message small { color: #64748b; }
        .chat-form { display: flex; gap: 6px; margin-top: 7px; }
        .chat-form input { margin: 0; flex: 1; }
        .chat-form button { width: 42px; background: var(--primary); color: white; border: 0; border-radius: 8px; cursor: pointer; }

        #modal-zoom {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 3000;
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
        }
        #modal-zoom img { max-width: 95%; max-height: 90%; border-radius: 8px; border: 2px solid rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fa-solid fa-gauge-high"></i> Monitoramento de Frota</h1>
        <button class="btn-sair" onclick="location.href='index.html'"><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
    </div>

    <div class="container">
        <div class="grid" id="lista-motoristas">
            <!-- Cards inseridos via JS -->
        </div>
    </div>

    <button class="fab" id="btn-abrir-modal" title="Cadastrar Novo Motorista">
        <i class="fa-solid fa-plus"></i>
    </button>

    <div class="modal" id="modal-cadastro">
        <div class="modal-content">
            <h3><i class="fa-solid fa-user-plus"></i> Novo Motorista</h3>
            <p id="modal-descricao" style="font-size: 13px; color: #64748b;">Defina as credenciais de acesso do motorista.</p>
            <input type="text" id="novo-nome-motorista" placeholder="Nome de Usuário">
            <input type="password" id="nova-senha-motorista" placeholder="Senha de Acesso">
            <input type="text" id="nova-placa-motorista" placeholder="Placa do veículo">
            <input type="text" id="nova-rota-motorista" placeholder="Rota">
            <div class="modal-buttons">
                <button class="btn-cancel" id="btn-fechar-modal">Cancelar</button>
                <button class="btn-save" id="btn-salvar-motorista">Salvar</button>
            </div>
        </div>
    </div>

    <div id="modal-zoom" onclick="this.style.display='none'">
        <img id="img-zoom" src="">
    </div>

    <script type="module">
        import { database, ref, onValue, set, remove } from './BD.js';
        import { montarChat } from './chat.js';

        const listaContainer = document.getElementById('lista-motoristas');
        const modal = document.getElementById('modal-cadastro');
        const btnAbrirModal = document.getElementById('btn-abrir-modal');
        const btnFecharModal = document.getElementById('btn-fechar-modal');
        const btnSalvarMotorista = document.getElementById('btn-salvar-motorista');
        const inputNome = document.getElementById('novo-nome-motorista');
        const inputSenha = document.getElementById('nova-senha-motorista');
        const inputPlaca = document.getElementById('nova-placa-motorista');
        const inputRota = document.getElementById('nova-rota-motorista');
        const modalTitulo = modal.querySelector('h3');
        let motoristaEmEdicao = null;

        btnAbrirModal.onclick = () => {
            motoristaEmEdicao = null;
            modalTitulo.innerHTML = '<i class="fa-solid fa-user-plus"></i> Novo Motorista';
            document.getElementById('modal-descricao').innerText = 'Defina as credenciais de acesso do motorista.';
            inputNome.disabled = false;
            inputSenha.value = '';
            inputPlaca.value = '';
            inputRota.value = '';
            modal.style.display = 'flex';
        };
        btnFecharModal.onclick = () => modal.style.display = 'none';

        window.editarMotorista = (nome, dados) => {
            motoristaEmEdicao = nome;
            modalTitulo.innerHTML = '<i class="fa-solid fa-pen-to-square"></i> Editar Motorista';
            document.getElementById('modal-descricao').innerText = 'Atualize as informações operacionais do motorista.';
            inputNome.value = dados.nome || nome;
            inputNome.disabled = true;
            inputSenha.value = dados.senha || '';
            inputPlaca.value = dados.placa || '';
            inputRota.value = dados.rota || '';
            modal.style.display = 'flex';
        };

        window.zoomImg = (src) => {
            const mz = document.getElementById('modal-zoom');
            document.getElementById('img-zoom').src = src;
            mz.style.display = 'flex';
        }

        window.deletarMotorista = async (nome) => {
            if(confirm(`Tem certeza que deseja remover ${nome}? Esta ação não pode ser desfeita.`)) {
                try {
                    await remove(ref(database, 'motoristas/' + nome));
                } catch (e) {
                    alert("Erro ao remover motorista.");
                }
            }
        }

        btnSalvarMotorista.onclick = async () => {
            const nome = inputNome.value.trim();
            const senha = inputSenha.value.trim();
            const placa = inputPlaca.value.trim();
            const rota = inputRota.value.trim();
            if (nome && senha) {
                try {
                    const nomeBanco = motoristaEmEdicao || nome;
                    await set(ref(database, 'motoristas/' + nomeBanco), {
                        nome: nome,
                        senha: senha,
                        placa,
                        rota,
                        status: "Cadastrado",
                        lat: 0,
                        lon: 0,
                        ultimaAtualizacao: new Date().toLocaleString(),
                        fotoMotorista: "",
                        fotoCarro: ""
                    });
                    modal.style.display = 'none';
                    inputNome.value = "";
                    inputSenha.value = "";
                    inputPlaca.value = "";
                    inputRota.value = "";
                    inputNome.disabled = false;
                    motoristaEmEdicao = null;
                } catch (e) {
                    alert("Erro ao salvar no banco de dados.");
                }
            } else {
                alert("Preencha todos os campos.");
            }
        };

        onValue(ref(database, 'motoristas'), (snapshot) => {
            listaContainer.innerHTML = "";
            const data = snapshot.val();
            
            if (data) {
                Object.keys(data).forEach(key => {
                    const m = data[key];
                    const card = document.createElement('div');
                    card.className = 'card-motorista';
                    
                    let statusColor = "#94a3b8"; 
                    if(m.status === "Em deslocamento") statusColor = "#3b82f6";
                    if(m.status === "No local") statusColor = "#10b981";
                    if(m.status === "Carregando") statusColor = "#f59e0b";
                    if(m.status === "Descarregando") statusColor = "#8b5cf6";

                    card.innerHTML = `
                        <button class="btn-delete" onclick="deletarMotorista('${m.nome}')" title="Excluir"><i class="fa-solid fa-trash"></i></button>
                        <div style="display:flex; align-items:center; justify-content: space-between;">
                            <div style="display:flex; align-items:center; gap: 12px;">
                                <img src="${m.fotoMotorista || 'https://cdn-icons-png.flaticon.com/512/149/149071.png'}" class="foto-thumb" onclick="zoomImg(this.src)">
                                <div>
                                    <strong style="font-size:16px;">${m.nome}</strong><br>
                                    <span class="status-tag" style="background:${statusColor}20; color:${statusColor}; border: 1px solid ${statusColor}40;">
                                        <i class="fa-solid fa-circle" style="font-size:8px; margin-right:5px;"></i>${m.status}
                                    </span>
                                </div>
                            </div>
                        </div>
                        <div class="info">
                            <p><i class="fa-solid fa-location-dot" style="color:var(--danger)"></i> <strong>Localização:</strong> 
                                <a class="map-link" href="https://www.google.com/maps?q=${m.lat},${m.lon}" target="_blank">
                                    Ver no Mapa <i class="fa-solid fa-arrow-up-right-from-square" style="font-size:10px;"></i>
                                </a>
                            </p>
                            <p><i class="fa-regular fa-clock"></i> <strong>Última Sincronia:</strong> ${m.ultimaAtualizacao}</p>
                            <p><i class="fa-solid fa-id-card"></i> <strong>Placa:</strong> ${m.placa || 'Não informada'}</p>
                            <p><i class="fa-solid fa-route"></i> <strong>Rota:</strong> ${m.rota || 'Não informada'}</p>
                            <button class="btn-edit" onclick='editarMotorista(${JSON.stringify(m.nome)}, ${JSON.stringify(m)})'><i class="fa-solid fa-pen-to-square"></i> Editar informações</button>
                            <a class="btn-edit" style="display:inline-block; text-decoration:none;" href="visualizacao.html?motorista=${encodeURIComponent(m.nome)}"><i class="fa-solid fa-eye"></i> Visualizar</a>
                            <div id="chat-${key.replace(/[^a-zA-Z0-9_-]/g, '-')}"></div>
                            <div style="margin-top:12px;">
                                <small style="font-weight:700; color:#94a3b8; font-size:10px; text-transform:uppercase;">Registro do Veículo</small>
                                <img src="${m.fotoCarro || 'https://via.placeholder.com/300x120?text=Sem+Foto+do+Veículo'}" class="veiculo-img" onclick="zoomImg(this.src)">
                            </div>
                        </div>
                    `;
                    listaContainer.appendChild(card);
                    montarChat({ database, containerId: `chat-${key.replace(/[^a-zA-Z0-9_-]/g, '-')}`, nomeUsuario: 'gerenciamento', destinatario: m.nome, chatId: m.nome });
                });
            } else {
                listaContainer.innerHTML = `
                    <div style='grid-column: 1/-1; text-align:center; padding: 40px; color:#64748b;'>
                        <i class="fa-solid fa-users-slash" style="font-size: 3rem; margin-bottom:15px; opacity:0.3;"></i>
                        <p>Nenhum motorista encontrado no sistema.</p>
                    </div>`;
            }
        });
    </script>
</body>
</html>
