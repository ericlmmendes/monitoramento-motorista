<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Motorista</title>
    <style>
        :root {
            --primary: #2563eb;
            --success: #22c55e;
            --bg: #f8fafc;
        }
        body { font-family: 'Segoe UI', sans-serif; padding: 20px; background: var(--bg); color: #334155; margin: 0; }
        .card { 
            background: white; 
            padding: 24px; 
            border-radius: 16px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
            max-width: 450px; 
            margin: 20px auto; 
        }
        h2 { margin-top: 0; font-size: 1.5rem; color: #0f172a; }
        label { display: block; margin-top: 15px; font-weight: 600; font-size: 14px; color: #64748b; }
        select, input, button { 
            width: 100%; 
            padding: 12px; 
            margin: 8px 0; 
            border-radius: 8px; 
            border: 1px solid #cbd5e1; 
            box-sizing: border-box;
            font-size: 15px;
        }
        select:focus, input:focus { border-color: var(--primary); outline: none; }
        
        button#btn-atualizar { 
            background: var(--primary); 
            color: white; 
            font-weight: 700; 
            border: none; 
            cursor: pointer; 
            margin-top: 20px;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
            transition: all 0.2s;
        }
        button#btn-atualizar:hover { background: #1d4ed8; transform: translateY(-1px); }
        
        #coords { 
            font-size: 13px; 
            color: #64748b; 
            background: #f1f5f9; 
            padding: 8px; 
            border-radius: 6px; 
            display: inline-block; 
            margin-bottom: 10px;
        }
        .btn-logout { background: #f1f5f9; color: #475569; border: 1px solid #e2e8f0; font-weight: 500; cursor: pointer; }
        input[type="file"] { font-size: 12px; padding: 8px; background: #fafafa; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Olá, <span id="nome-exibicao" style="color: var(--primary);"></span>! 👋</h2>
        <p id="coords">📍 Localização: Obtendo coordenadas...</p>
        
        <label>Qual o status agora?</label>
        <select id="status-viagem">
            <option value="Em deslocamento">🚚 Em deslocamento</option>
            <option value="No local">📍 No local</option>
            <option value="Carregando">📦 Carregando</option>
            <option value="Descarregando">📥 Descarregando</option>
        </select>

        <label>Sua Foto (Selfie):</label>
        <input type="file" id="foto-motorista" accept="image/*">
        
        <label>Foto do Veículo:</label>
        <input type="file" id="foto-carro" accept="image/*">

        <button id="btn-atualizar">ENVIAR ATUALIZAÇÃO</button>
        <button onclick="location.href='index.html'" class="btn-logout">Sair do Sistema</button>
    </div>

    <script type="module">
        import { database, ref, update } from './BD.js';

        const motoristaNome = localStorage.getItem('motorista_nome') || 'Anonimo';
        document.getElementById('nome-exibicao').innerText = motoristaNome;

        let lat = 0, lon = 0;
        let fotoMotoBase64 = "", fotoCarroBase64 = "";

        // Geolocalização
        navigator.geolocation.watchPosition(pos => {
            lat = pos.coords.latitude;
            lon = pos.coords.longitude;
            document.getElementById('coords').innerText = `📍 Localização: ${lat.toFixed(5)}, ${lon.toFixed(5)}`;
        }, err => console.error(err), { enableHighAccuracy: true });

        // Helper para converter imagem em Base64
        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        document.getElementById('btn-atualizar').addEventListener('click', async () => {
            const status = document.getElementById('status-viagem').value;
            const fileM = document.getElementById('foto-motorista').files[0];
            const fileC = document.getElementById('foto-carro').files[0];

            const originalText = document.getElementById('btn-atualizar').innerText;
            document.getElementById('btn-atualizar').innerText = "Enviando...";
            document.getElementById('btn-atualizar').disabled = true;

            try {
                if(fileM) fotoMotoBase64 = await toBase64(fileM);
                if(fileC) fotoCarroBase64 = await toBase64(fileC);

                const updates = {};
                updates['/motoristas/' + motoristaNome] = {
                    nome: motoristaNome,
                    status: status,
                    lat: lat,
                    lon: lon,
                    fotoMotorista: fotoMotoBase64,
                    fotoCarro: fotoCarroBase64,
                    ultimaAtualizacao: new Date().toLocaleString()
                };

                await update(ref(database), updates);
                alert("Dados atualizados com sucesso!");
            } catch (err) {
                alert("Erro ao atualizar: " + err.message);
            } finally {
                document.getElementById('btn-atualizar').innerText = originalText;
                document.getElementById('btn-atualizar').disabled = false;
            }
        });
    </script>
</body>
</html>
