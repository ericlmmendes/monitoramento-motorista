<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Monitoramento</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --text: #1e293b;
        }
        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
            margin: 0; 
            color: var(--text);
        }
        .login-container { 
            background: white; 
            padding: 2.5rem; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 380px; 
        }
        h2 { text-align: center; margin-bottom: 1.5rem; font-weight: 700; color: #0f172a; }
        .input-group { margin-bottom: 1rem; }
        input { 
            width: 100%; 
            padding: 12px 16px; 
            margin: 8px 0; 
            border: 1px solid #cbd5e1; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 14px;
            transition: border-color 0.2s;
        }
        input:focus { outline: none; border-color: var(--primary); ring: 2px solid #bfdbfe; }
        button { 
            width: 100%; 
            padding: 12px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: 600;
            transition: background 0.2s;
            margin-top: 10px;
        }
        button:hover { background: var(--primary-hover); }
        .error { 
            color: #dc2626; 
            font-size: 13px; 
            text-align: center; 
            display: none; 
            background: #fee2e2;
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Acesso ao Sistema</h2>
        <div id="error-msg" class="error">Credenciais inválidas!</div>
        <input type="text" id="usuario" placeholder="Usuário (motorista ou admin)">
        <input type="password" id="senha" placeholder="Senha">
        <button onclick="fazerLogin()">Entrar</button>
    </div>

    <script>
        function fazerLogin() {
            const user = document.getElementById('usuario').value;
            const pass = document.getElementById('senha').value;
            const error = document.getElementById('error-msg');

            // Lógica simples de acesso solicitada
            if (user === 'admin' && pass === '123') {
                window.location.href = 'gerenciamento.html';
            } else if (user !== '' && pass === '123') {
                localStorage.setItem('motorista_nome', user);
                window.location.href = 'motorista.html';
            } else {
                error.style.display = 'block';
            }
        }
    </script>
</body>
</html>
