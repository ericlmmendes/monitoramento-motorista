<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Monitoramento</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --text: #1e293b;
        }
        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            background: #0f172a;
            margin: 0; 
            color: var(--text);
        }
        .login-container { 
            background: white; 
            padding: 2.5rem; 
            border-radius: 16px; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); 
            width: 100%; 
            max-width: 380px; 
        }
        .logo-area { text-align: center; margin-bottom: 2rem; }
        .logo-area i { font-size: 3rem; color: var(--primary); margin-bottom: 10px; }
        h2 { text-align: center; margin: 0; font-weight: 700; color: #0f172a; font-size: 1.5rem; }
        p.subtitle { text-align: center; color: #64748b; font-size: 0.9rem; margin-top: 5px; margin-bottom: 20px; }
        
        .input-wrapper { position: relative; margin-bottom: 15px; }
        .input-wrapper i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #94a3b8; }
        
        input { 
            width: 100%; 
            padding: 12px 12px 12px 40px; 
            border: 1px solid #e2e8f0; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 14px;
            transition: all 0.2s;
        }
        input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        
        button { 
            width: 100%; 
            padding: 12px; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: 600;
            transition: background 0.2s;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        button:hover { background: var(--primary-hover); }
        .error { 
            color: #dc2626; 
            font-size: 13px; 
            text-align: center; 
            display: none; 
            background: #fee2e2;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #fecaca;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo-area">
            <i class="fa-solid fa-truck-fast"></i>
            <h2></h2>
            <p class="subtitle">Monitoramento de Frota</p>
        </div>
        <div id="error-msg" class="error"><i class="fa-solid fa-circle-exclamation"></i> Credenciais inválidas!</div>
        
        <div class="input-wrapper">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="usuario" placeholder="Usuário">
        </div>
        
        <div class="input-wrapper">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="senha" placeholder="Senha">
        </div>

        <button id="btn-login"><i class="fa-solid fa-right-to-bracket"></i> Entrar no Sistema</button>
    </div>

    <script type="module">
        import { database, ref, get } from './BD.js';

        async function fazerLogin() {
            const user = document.getElementById('usuario').value.trim();
            const pass = document.getElementById('senha').value.trim();
            const error = document.getElementById('error-msg');
            const btn = document.getElementById('btn-login');

            if (!user || !pass) {
                error.innerText = "Preencha todos os campos!";
                error.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Autenticando...';

            try {
                if (user === 'admin' && pass === '123') {
                    window.location.href = 'gerenciamento.html';
                } else {
                    // Validação no Banco de Dados para Motoristas
                    const snapshot = await get(ref(database, 'motoristas/' + user));
                    if (snapshot.exists()) {
                        const dados = snapshot.val();
                        if (dados.senha === pass) {
                            localStorage.setItem('motorista_nome', user);
                            window.location.href = 'motorista.html';
                        } else {
                            error.innerText = "Senha incorreta!";
                            error.style.display = 'block';
                        }
                    } else {
                        error.innerText = "Usuário não cadastrado!";
                        error.style.display = 'block';
                    }
                }
            } catch (e) {
                console.error(e);
                error.innerText = "Erro de conexão com o servidor.";
                error.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Entrar no Sistema';
            }
        }
        document.getElementById('btn-login').onclick = fazerLogin;
        
        // Atalho Enter
        document.addEventListener('keypress', (e) => { if(e.key === 'Enter') fazerLogin(); });
    </script>
</body>
</html>
